# 마켓 레이더 · 글로벌(패권 이동) 설정 (scripts/build_macro.py)
# 나라·지역 대표 ETF, 테마별 대표 종목·ETF, 환율·원자재 목록입니다. 야후 파이낸스 티커를 씁니다.
# 목록을 바꾸고 싶으면 한 줄만 고치면 됩니다. 점수·후보는 매일 이 목록으로 다시 계산합니다.

base: SPY              # 모든 상대수익의 기준(미국 대표)
fx_base: NZDUSD=X      # 뉴질랜드달러 기준 보기에 쓰는 환율(1 NZD = ? USD)

# 패권 레이더의 지역(5곳) → 대표 ETF. 지역 점수 = ▲ 개수 − ▼ 개수 (web/data/hegemony.json)
regions:
  us: { n: 미국,   etf: SPY }
  eu: { n: 유럽,   etf: VGK }
  cn: { n: 중국,   etf: MCHI }
  in: { n: 인도,   etf: INDA }
  la: { n: 중남미, etf: ILF }
  ot: { n: 아태·기타, etf: AAXJ }   # 패권 레이더가 평가하지 않는 나라들(점수 없음)

# 나라별 대표 ETF. cur 는 달러 대비 환율을 볼 통화(없으면 생략)
countries:
  - { y: EWG,  n: 독일,       rg: eu, cur: EUR }
  - { y: EWU,  n: 영국,       rg: eu, cur: GBP }
  - { y: EWQ,  n: 프랑스,     rg: eu, cur: EUR }
  - { y: EWI,  n: 이탈리아,   rg: eu, cur: EUR }
  - { y: EWP,  n: 스페인,     rg: eu, cur: EUR }
  - { y: EWL,  n: 스위스,     rg: eu, cur: CHF }
  - { y: EWN,  n: 네덜란드,   rg: eu, cur: EUR }
  - { y: EPOL, n: 폴란드,     rg: eu }
  - { y: MCHI, n: 중국,       rg: cn, cur: CNY }
  - { y: EWH,  n: 홍콩,       rg: cn }
  - { y: INDA, n: 인도,       rg: in, cur: INR }
  - { y: EWZ,  n: 브라질,     rg: la, cur: BRL }
  - { y: EWW,  n: 멕시코,     rg: la, cur: MXN }
  - { y: ECH,  n: 칠레,       rg: la }
  - { y: ARGT, n: 아르헨티나, rg: la }
  - { y: EWJ,  n: 일본,       rg: ot, cur: JPY }
  - { y: EWY,  n: 한국,       rg: ot, cur: KRW }
  - { y: EWT,  n: 대만,       rg: ot, cur: TWD }
  - { y: EWA,  n: 호주,       rg: ot, cur: AUD }
  - { y: ENZL, n: 뉴질랜드,   rg: ot, cur: NZD }
  - { y: EWC,  n: 캐나다,     rg: ot, cur: CAD }
  - { y: VNM,  n: 베트남,     rg: ot }
  - { y: EIDO, n: 인도네시아, rg: ot }
  - { y: THD,  n: 태국,       rg: ot }
  - { y: EWS,  n: 싱가포르,   rg: ot }
  - { y: KSA,  n: 사우디,     rg: ot }
  - { y: EZA,  n: 남아공,     rg: ot }
  - { y: TUR,  n: 튀르키예,   rg: ot }
  - { y: EIS,  n: 이스라엘,   rg: ot }

# 지역·묶음 대표 (나라 지도에서 참고선으로 보임)
blocs:
  - { y: VGK,  n: 유럽 전체,        rg: eu }
  - { y: ILF,  n: 중남미 전체,      rg: la }
  - { y: AAXJ, n: 아시아(일본 제외), rg: ot }
  - { y: ACWX, n: 미국 제외 전세계,  rg: ot }
  - { y: EEM,  n: 신흥국,           rg: ot }

# 테마 × 지역 지도. cells: 지역 → 야후 티커. 비어 있는 칸은 대표 ETF 가 마땅치 않은 곳입니다.
themes:
  - id: core
    n: 시장 전체
    why: 미국에서 다른 지역으로 자금이 이동하는지 보는 가장 기본 줄
    cells: { us: SPY, eu: VGK, cn: MCHI, in: INDA, la: ILF, ot: AAXJ }
  - id: tech
    n: 기술·반도체
    why: 미·중 기술 분리로 공급망과 자체 기술 경쟁이 재편
    cells: { us: SMH, eu: ASML, cn: CQQQ, ot: EWT }
  - id: def
    n: 방산·안보
    why: 미국 안보 공약이 약해지면 유럽·동맹의 군비 지출이 늘어남
    cells: { us: ITA, eu: EUAD }
  - id: supply
    n: 공급망 이전·제조
    why: 중국 의존을 줄이는 제조·인프라 이전(인도·멕시코·베트남)의 수혜
    cells: { us: PAVE, in: EPI, la: EWW, ot: VNM }
  - id: res
    n: 에너지·자원
    why: 탈달러·자원 확보 경쟁에서 원자재 수출국이 받는 영향
    cells: { us: XLE, la: EWZ, ot: EWA }

# 지역에 묶이지 않는 후보 (rg: gl)
globals:
  - { y: GLD,  n: 금 (SPDR Gold),     th: gold }
  - { y: GDX,  n: 금광주 (VanEck),    th: gold }
  - { y: COPX, n: 구리 광산 (Global X), th: res }

# 후보 점수의 '지역 신호' 칸을 지역 점수 대신 특정 항목으로 보는 종목
sig_override:
  GLD: { rg: us, cat: 통화·금융, want: "▼" }   # 미국 통화·금융이 약화(달러·국채)일 때 금이 유리하다는 해석
  GDX: { rg: us, cat: 통화·금융, want: "▼" }

# 표시 이름(티커 → 한국어) — 목록에 없으면 야후 이름을 씁니다
names:
  SMH: 반도체 (VanEck)
  ASML: ASML (유럽 반도체 장비)
  CQQQ: 중국 기술 (Invesco)
  ITA: 미국 항공·방산 (iShares)
  EUAD: 유럽 항공·방산 (Select STOXX)
  PAVE: 미국 인프라 (Global X)
  EPI: 인도 기업이익 (WisdomTree)
  XLE: 미국 에너지 (SPDR)
  SPY: 미국 S&P 500
  VGK: 유럽 전체 (Vanguard)
  MCHI: 중국 (iShares MSCI)
  INDA: 인도 (iShares MSCI)
  ILF: 중남미 40 (iShares)
  AAXJ: 아시아 일본 제외 (iShares)

# 환율: 야후 티커, inv=true 면 '1달러 = ? 외화' 형태라 뒤집어 '외화 가치'로 환산
fx:
  - { k: EUR, n: 유로,       y: EURUSD=X }
  - { k: JPY, n: 엔,         y: JPY=X,    inv: true }
  - { k: CNY, n: 위안,       y: CNY=X,    inv: true }
  - { k: INR, n: 루피,       y: INR=X,    inv: true }
  - { k: BRL, n: 헤알,       y: BRL=X,    inv: true }
  - { k: MXN, n: 페소,       y: MXN=X,    inv: true }
  - { k: KRW, n: 원,         y: KRW=X,    inv: true }
  - { k: TWD, n: 대만달러,   y: TWD=X,    inv: true }
  - { k: AUD, n: 호주달러,   y: AUDUSD=X }
  - { k: NZD, n: 뉴질랜드달러, y: NZDUSD=X }
  - { k: CAD, n: 캐나다달러, y: CAD=X,    inv: true }
  - { k: GBP, n: 파운드,     y: GBPUSD=X }
  - { k: CHF, n: 스위스프랑, y: CHF=X,    inv: true }

# 달러·금·금리·원자재
macro:
  - { y: DX-Y.NYB, n: 달러인덱스, u: pt }
  - { y: GC=F,     n: 금 (달러/온스), u: usd }
  - { y: HG=F,     n: 구리 (달러/파운드), u: usd }
  - { y: CL=F,     n: 원유 WTI (달러/배럴), u: usd }
  - { y: ^TNX,     n: 미국 10년 국채금리, u: pct, diff: true }

# 지역별 정책·구조 리스크(규칙 기반 후보 카드의 '리스크' 줄에 쓰는 고정 문구, 판단 근거가 아니라 점검 항목)
risk:
  us: 연준 정책·재정적자·관세 정책에 따른 변동
  eu: 에너지 가격·정치 분열·성장 둔화, 유로 약세 시 달러 기준 수익이 줄어듦
  cn: 정책·규제 변화, 미중 갈등(수출통제·상장 규제), 부동산 부담
  in: 높은 밸류에이션, 루피 약세, 외국인 자금 유출입에 따른 변동
  la: 정치·재정 불안, 원자재 가격 의존, 통화 변동폭이 큼
  ot: 나라별 정책·통화·수출 의존도 차이가 큼
  gl: 금리·달러가 반등하면 조정받을 수 있고 이자·배당이 없음

# 13F 큰손 매수·매도를 지역으로 나누는 기준(티커). 미국 상장 ADR·지역 ETF
adr:
  cn: [BABA, BIDU, JD, PDD, TME, GDS, KWEB, FXI, MCHI, CQQQ, NIO, LI, XPEV, YUMC, TCOM, BEKE]
  in: [INDA, EPI, INDY, SMIN, INFY, HDB, IBN]
  la: [MELI, PBR, YPF, ARGT, EWZ, ILF, VALE, NU, ITUB, BBD, ECH, EWW]
  eu: [STM, SHEL, SAP, NVO, EZU, VGK, EWG, EWQ, FEZ, ASML]
  ot: [TSM, EWY, CPNG, SE, EWJ, EWT, IEMG, VWO]
  gl: [GLD, SLV, GDX]
adr_issuer:          # 티커가 비어 있는 보고에서 발행사 이름으로 찾음(소문자 포함 검색)
  eu: ["asml", "deutsche bk"]

thresholds:
  min_turnover_usd: 5000000   # 20거래일 평균 거래대금이 이보다 작으면 '유동성 부족'
  flow_ratio: 1.15            # 20일 평균 거래대금 ÷ 120일 평균 ≥ 1.15 이면 '자금 몰림'
  info_ttl_days: 14
