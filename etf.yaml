# 마켓 레이더 · ETF 등락 설정 (scripts/build_etf.py)
# 미국 상장 ETF 는 나스닥 심볼 목록(nasdaqtraded.txt)에서 매일 전부 가져오고,
# 중국·인도 현지 상장 ETF 는 아래 목록을 씁니다(Yahoo Finance 티커). 목록에 없는 ETF 를 보고 싶으면 한 줄 추가하면 됩니다.

# 제외: 이름으로 레버리지·인버스·VIX(변동성 지수) ETF 를 거르고, 거래가 적거나 작은 ETF 를 뺍니다.
min_turnover:              # 최근 20거래일 평균 거래대금(현지 통화) 이 이보다 작으면 '저유동성'
  USD: 1000000             # 약 $1M
  CNY: 20000000            # 약 ¥2천만 (≈ $2.8M)
  HKD: 5000000             # 약 HK$5백만 (≈ $0.6M)
  INR: 20000000            # 약 ₹2천만 (≈ $0.24M)
min_aum_usd: 50000000      # 운용자산(AUM)을 알 수 있는 ETF 중 $50M 미만은 '소형'으로 제외
min_history_days: 20       # 상장 20거래일 미만은 제외 (기간 수익률을 낼 수 없음)
illiquid_recheck_days: 7   # 저유동성으로 빠진 미국 ETF 는 7일 동안 받지 않고 건너뜀(요청 수 절약)
info_ttl_days: 14          # 운용사·AUM·보수·보유종목은 14일마다 다시 받음
info_max_per_run: 320      # 한 번 실행에서 새로 받을 상세정보 수 (등락·배당 순위 후보)
top_n: 20

# 이름 규칙으로 못 거르는 ETF 를 손으로 지정 (Yahoo 티커)
exclude: [SVIX, SVOL, UVIX, UVXY, VIXY, VIXM, VXX, VXZ, SQQQ, TQQQ, SOXL, SOXS, SPXU, SPXL, UPRO, SDS, SH, PSQ, DOG, RWM, TZA, TNA, YANG, YINN, CHAU, CWEB, INDL]
# 이름 규칙으로 잘못 걸러진 ETF 를 되살리기 / 나라를 강제로 지정
force_include: []
force_country: {}          # 예: { KWEB: cn }

