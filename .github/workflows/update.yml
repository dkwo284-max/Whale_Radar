name: Whale Radar update

# 매일 SEC 공시·뉴스를 모아 web/data 에 저장하고 GitHub Pages 로 배포합니다.
# SEC EDGAR 는 미국 동부시간(ET) 밤 10시에 그날 접수를 마감하므로, 마감 직후에 돌려 그날 공시를 모두 담습니다.
#   UTC 03:37 = 미국 동부 서머타임(EDT) 밤 11:37 / 표준시(EST) 밤 10:37 — 계절과 관계없이 마감 뒤
#   (뉴질랜드 시간으로는 오후 4~5시대)
# GitHub 예약 실행은 붐비면 몇 시간씩 늦거나 건너뛰는 일이 있어서, 03:37 이후에 예비 시각을 몇 번 더 둡니다.
# check 잡이 "오늘 03:37 UTC 이후에 이미 갱신됐는지" 보고, 갱신됐으면 예비 실행은 곧바로 끝냅니다(수집·배포 없음).
on:
  schedule:
    - cron: "37 3 * * *"
    - cron: "17 5 * * *"
    - cron: "47 6 * * *"
    - cron: "17 9 * * *"
    - cron: "47 12 * * *"
  workflow_dispatch:
    inputs:
      news:
        description: "뉴스·AI 요약도 함께 (false 면 SEC 공시만)"
        default: "true"
  push:
    branches: [main]
    paths: ["web/**", "!web/data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: web/data
          sparse-checkout-cone-mode: false
      - id: g
        run: |
          run=true
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f web/data/dashboard.json ]; then
            gen=$(python3 -c "import json; d = json.load(open('web/data/dashboard.json')); print('' if d.get('demo') else d.get('generated_at', ''))" || true)
            if [ -n "$gen" ] && g=$(date -u -d "$gen" +%s 2>/dev/null) && [ "$g" -ge "$(date -u -d 'today 03:37' +%s)" ]; then
              run=false
              echo "already updated at $gen; skipping"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  update:
    needs: check
    if: github.event_name != 'push' && needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: Collect
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/build.py ${{ github.event.inputs.news == 'false' && '--no-news' || '' }}
      - name: Commit data
        run: |
          git config user.name "whale-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data cache
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done

  deploy:
    needs: update
    if: always() && (needs.update.result == 'success' || github.event_name == 'push')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: pages
        uses: actions/deploy-pages@v4
